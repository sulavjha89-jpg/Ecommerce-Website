<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        /* Main navbar container */
        .main-flex {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: #ddd2d2;
            border-bottom: 1px solid #e0e0e0;
            font-family: Roboto, Arial, sans-serif;
        }
        /* Left side */
        .left-flex {
            display: flex;
            align-items: center;
            gap: -30px;
        }
        /* Hamburger icon wrapper */
        .add-icon {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
        }
        .add-icon:hover {
            background: #f1f3f4;
        }
        /* Gmail logo + icon area */
        .icon {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        /* SVG hamburger (if used) */
        .icon svg {
            width: 30px;
            height: 30px;
            fill: #69727c;
            position: relative;
        }
        /* Gmail logo */
        .icon img {
            height: 40px;
            width: 40px;
            border-radius: 100%;
        }
        /* Optional absolute span (click ripple / overlay) */
        .icon .absolute {
            position: absolute;
            border-radius: 50%;
        }
        .background-image{
            height: 100vh;
            width: 100vw;
                background-image: url("image/image.webp");
               background-repeat: no-repeat;
  background-position: right top;
  /* background-attachment: fixed; */
        }
    </style>
</head>
<body>
    <div id="main" class="main-flex">
        <!--leftside-->
        <div class="left-flex">
            <div class="add-icon">
                <i data-lucide="menu"></i>
            </div>
            <div class="icon">
                <img class="gb_0c"
                    src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png"
                    srcset="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png 1x, https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_2x_r5.png 2x "
                    alt="" aria-hidden="true" role="presentation" style="width:109px;height:40px">
                <span class="absolute"></span>
            </div>
        </div>
        <!--centre-->
        <div class="center">
            <div class="input-wrapper">


            </div>

        </div>
        <div class="right-flex">
            <div class="input-wrapper">


            </div>
        </div>
        </div>
         <div class="background-image">
            </div>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            lucide.createIcons();
        </script>
</body>
</html>
