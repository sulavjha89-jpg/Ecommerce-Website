<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        @font-face{
            font-family: 'poppins';
            src: ('poppins/poppins-Regular.ttf');
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins',sans-serif;
        }
        body{
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            /* margin-top: 5%; */
            background: #333;
        }
        .login{
            border: 1px solid black;
            width: 400px;
            height: 500px;
            background: url(image/bg-01.jpg);
            background-position: center;
            background-size: cover;
            color: white;
            border-radius: 20px;
            box-shadow: 30px 20px 1px rgba(0, 0, 0, 75);
            overflow: hidden;
        }
        form{
            display: block;
            box-sizing: border-box;
            padding: 40px;
            width: 100%;
            height: 100%;
            backdrop-filter:brightness(40%);
            flex-direction: column;
            display: flex;
            gap: 5px;
        }
        h1{
            font-size: 15
            px;
            font-weight: 600;
            text-shadow: 0 0 2px rgba(0, 0, 0, .5);
            margin-bottom: 60px;
        }
       label{
        color: rgba(255, 255, 255, .8);
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 2px;
        padding-left: 10px;
        
       }
       input{
        background: rgba(225, 255, 255, .3);
        height: 40px;
        line-height: 40px;
        border-radius: 20px;
        padding: 0 20px;
        margin-bottom: 20px;
        color: white;
        
       }
        button{
            background: darkgreen;
            height: 40px;
            line-height: 40px;
            border-radius: 40px;
            margin: 10px 0;
            box-shadow: 0 0 5px rgba(0, 0, 0, .3);
            color: white;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
        }
        button:hover{
            background: green;
        }

    </style>
</head>
<body>
    <div class="login">
        <form>
            <h1>LOG IN</h1>
            <label>Username</label>
            <input type="text">
            <label>Password</label>
            <input type="password">
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
