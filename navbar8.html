<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar 8</title>
    <style>
        .main-flex{ display: flex;
            padding: 10px 20px;
            justify-content: space-between;
            align-items: center;
            background: #fffcfc;
            border-radius: 10px;

        }
        .left-flex{
            display: flex;
            align-items: center;
            padding: 10px 10px;
            gap: 30px;
        }
        .add-icon{
            height: 30px;
            width: 30px;
            border-radius: 100%;
            display: flex;
        background-color: rgb(165, 165, 199);
        align-items: center;
        }
            .add-icon :hover{
                background-color: rgb(158, 105, 105);   
                 cursor: pointer;
                 border-radius: 100%;
                   }
             .alpha{  display: flex;
            align-items:center;
            font-size: 20px;
            gap: 30px;}
            a{
                text-decoration: none;
            }
        
        
        .right-flex{
            display: flex;
            align-items: center;
            gap: 40px;

        }
        .avatar img{
            height: 30px;
            width: 30px;
            align-items: center;
            border-radius: 100%;
        }
        .icon{
            display: flex;
            align-items: center;
            gap: 30px;
            border-radius: 100%;
        }
        .icon :hover{
            background-color: rgb(211, 155, 86);
            cursor: pointer;
            border-radius: 100%;
        }
       
    </style>
</head>
<body>
    <div class="main-flex">
        <div class="left-flex">
            <div class="add-icon">
                <i data-lucide="play"></i>  
            </div>
        
        <div class="alpha">
            <a href="#">Games</a>
            <a href="#">Apps</a>
            <a href="#">Kids</a>
        </div>
        </div>
        <div class="rignt-flex">
            <div class="icon">
                <i data-lucide="search"></i>  
<i data-lucide="circle-question-mark"></i>
            
            <div class="avatar">
                <img src="https://media.springernature.com/lw703/springer-static/image/art%3A10.1038%2F528452a/MediaObjects/41586_2015_Article_BF528452a_Figg_HTML.jpg">
            </div>
            </div>

        </div>
    </div>
     <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
